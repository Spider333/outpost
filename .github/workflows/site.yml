# Publishes GitHub Pages on every push to main that changes the site or the client:
# the tutorial (site/) at the root and the web client, built from this commit, at app/.
# The client files get a build provenance attestation, so anyone can check that the file
# GitHub Pages serves was built by this workflow from this repository:
#   curl -sO https://spider333.github.io/outpost/app/app.js
#   gh attestation verify app.js -R Spider333/outpost
name: site
on:
  push:
    branches: [main]
    paths: ["site/**", "src/**", "scripts/**", "package.json", "package-lock.json", ".github/workflows/site.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  attestations: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Assemble the site
        run: |
          mkdir -p _site/app
          cp -R site/. _site/
          cp dist/web/index.html dist/web/app.js dist/web/app.js.map dist/web/style.css _site/app/
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            _site/app/index.html
            _site/app/app.js
            _site/app/style.css
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
